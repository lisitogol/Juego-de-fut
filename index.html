<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Mini Fútbol</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

button{
    font-family:inherit;
}

.screen{
    position:absolute;
    inset:0;
    display:none;
}

.screen.active{
    display:flex;
}


/* =========================
   MENÚ
========================= */

#menu{
    justify-content:center;
    align-items:center;
    background:url("imagenes/fondo.JPG") center/cover no-repeat;
}

.menu-dark{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.28);
}

.menu-content{
    position:relative;
    z-index:2;
    text-align:center;
}

.title{
    color:white;
    font-size:clamp(45px,9vw,90px);
    font-weight:900;
    text-shadow:4px 4px 0 #111;
    margin-bottom:35px;
}

.big-button{
    border:0;
    border-radius:18px;
    padding:16px 38px;
    background:#168a3b;
    color:white;
    font-size:clamp(20px,4vw,32px);
    font-weight:bold;
    box-shadow:0 6px 0 #075b25;
}

.big-button:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #075b25;
}


/* =========================
   SELECCIÓN
========================= */

#selection{
    justify-content:center;
    align-items:center;
    background:url("imagenes/seleccion.png") center/cover no-repeat;
}

.selection-dark{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.18);
}

.selection-content{
    position:relative;
    z-index:2;
    width:min(95%,850px);
    text-align:center;
}

.selection-title{
    color:white;
    font-size:clamp(28px,6vw,55px);
    font-weight:900;
    text-shadow:3px 3px 0 #111;
    margin-bottom:20px;
}

.country-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.country{
    border:0;
    border-radius:15px;
    padding:10px;
    background:rgba(255,255,255,.9);
    box-shadow:0 5px 0 rgba(0,0,0,.4);
}

.country:active{
    transform:translateY(4px);
    box-shadow:0 1px 0 rgba(0,0,0,.4);
}

.country img{
    width:clamp(55px,12vw,95px);
    height:clamp(55px,12vw,95px);
    object-fit:contain;
}

.country-name{
    display:block;
    margin-top:5px;
    font-size:clamp(12px,2.5vw,20px);
    font-weight:bold;
}


/* =========================
   PARTIDO
========================= */

#match{
    background:#222;
}

#field{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:url("imagenes/cancha.JPEG") center/cover no-repeat;
}


/* =========================
   MARCADOR
========================= */

#scoreboard{
    position:absolute;
    z-index:30;
    top:10px;
    left:50%;
    transform:translateX(-50%);

    display:flex;
    align-items:center;
    gap:14px;

    padding:7px 16px;
    border-radius:15px;

    background:rgba(0,0,0,.72);
    color:white;

    font-size:clamp(18px,4vw,30px);
    font-weight:900;
}

.score-team{
    display:flex;
    align-items:center;
    gap:6px;
}

.score-team img{
    width:32px;
    height:32px;
    object-fit:contain;
}


/* =========================
   JUGADORES
========================= */

.player{
    position:absolute;
    z-index:10;
    width:70px;
    height:110px;
    transform-origin:center bottom;
}

.player img{
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
}

#player{
    left:25%;
    bottom:16%;
}

#enemy{
    left:70%;
    bottom:16%;
}


/* =========================
   BALÓN
========================= */

#ball{
    position:absolute;
    z-index:12;
    width:42px;
    height:42px;
    object-fit:contain;
    pointer-events:none;
    transform-origin:center;
}


/* =========================
   PORTERÍAS
========================= */

.goal{
    position:absolute;
    z-index:5;
    width:105px;
    height:220px;
    object-fit:fill;
    pointer-events:none;
}

#goal-left{
    left:0;
    top:50%;
    transform:translateY(-50%) scaleX(-1);
}

#goal-right{
    right:0;
    top:50%;
    transform:translateY(-50%);
}


/* =========================
   CONTROLES
========================= */

#controls{
    position:absolute;
    inset:0;
    z-index:40;
    pointer-events:none;
}

#joystick-zone{
    position:absolute;
    left:20px;
    bottom:20px;
    width:150px;
    height:150px;
    pointer-events:auto;
    touch-action:none;
}

#joystick-base{
    position:absolute;
    left:50%;
    top:50%;
    width:130px;
    height:130px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,255,255,.25);
    border:3px solid rgba(255,255,255,.5);
}

#joystick-stick{
    position:absolute;
    left:50%;
    top:50%;
    width:58px;
    height:58px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,255,255,.75);
    border:3px solid rgba(0,0,0,.25);
}

.shot-button{
    position:absolute;
    right:25px;
    width:85px;
    height:85px;
    border-radius:50%;
    border:4px solid rgba(255,255,255,.7);
    color:white;
    font-size:14px;
    font-weight:900;
    pointer-events:auto;
    touch-action:none;
}

#normal-shot{
    bottom:30px;
    background:rgba(30,130,255,.75);
}

#high-shot{
    bottom:130px;
    background:rgba(255,150,30,.8);
}

.shot-button:active{
    transform:scale(.92);
}


/* =========================
   GOL
========================= */

#goal-message{
    position:absolute;
    z-index:100;
    left:50%;
    top:40%;
    transform:translate(-50%,-50%) scale(.7);
    opacity:0;
    pointer-events:none;
    color:white;
    font-size:clamp(45px,10vw,100px);
    font-weight:900;
    text-shadow:5px 5px 0 #111;
    transition:.25s;
}

#goal-message.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}


/* =========================
   FINAL
========================= */

#end-screen{
    position:absolute;
    inset:0;
    z-index:200;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.75);
}

#end-screen.show{
    display:flex;
}

.end-box{
    text-align:center;
    color:white;
}

.end-box h1{
    font-size:clamp(40px,9vw,80px);
    margin:0 0 20px;
}

.end-box button{
    border:0;
    border-radius:15px;
    padding:15px 30px;
    font-size:22px;
    font-weight:bold;
}


/* =========================
   MODO VERTICAL
========================= */

@media(max-width:700px) and (orientation:portrait){

    .country-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .player{
        width:55px;
        height:90px;
    }

    .goal{
        width:70px;
        height:170px;
    }

    #joystick-zone{
        width:125px;
        height:125px;
    }

    #joystick-base{
        width:110px;
        height:110px;
    }

    #joystick-stick{
        width:50px;
        height:50px;
    }

    .shot-button{
        width:72px;
        height:72px;
        right:15px;
    }

    #high-shot{
        bottom:110px;
    }
}
</style>
</head>

<body>

<div id="game">


<!-- =========================
     MENÚ
========================= -->

<section id="menu" class="screen active">

    <div class="menu-dark"></div>

    <div class="menu-content">

        <div class="title">
            MINI FÚTBOL
        </div>

        <button class="big-button" onclick="startSelection()">
            JUGAR ⚽
        </button>

    </div>

</section>


<!-- =========================
     SELECCIÓN
========================= -->

<section id="selection" class="screen">

    <div class="selection-dark"></div>

    <div class="selection-content">

        <div class="selection-title">
            ELIGE TU PAÍS
        </div>

        <div class="country-grid">

            <button class="country" onclick="chooseCountry('mexico')">
                <img src="imagenes/mexicoescudo.PNG">
                <span class="country-name">México</span>
            </button>

            <button class="country" onclick="chooseCountry('brasil')">
                <img src="imagenes/brasilescudo.PNG">
                <span class="country-name">Brasil</span>
            </button>

            <button class="country" onclick="chooseCountry('argentina')">
                <img src="imagenes/argentinaescudo.PNG">
                <span class="country-name">Argentina</span>
            </button>

            <button class="country" onclick="chooseCountry('alemania')">
                <img src="imagenes/alemaniaescudo.PNG">
                <span class="country-name">Alemania</span>
            </button>

        </div>

    </div>

</section>


<!-- =========================
     PARTIDO
========================= -->

<section id="match" class="screen">

    <div id="field">

        <img
            id="goal-left"
            class="goal"
            src="imagenes/porteria.PNG"
        >

        <img
            id="goal-right"
            class="goal"
            src="imagenes/porteria.PNG"
        >

        <img
            id="ball"
            src="imagenes/balon.PNG"
        >

        <div id="player" class="player">
            <img id="player-image">
        </div>

        <div id="enemy" class="player">
            <img id="enemy-image">
        </div>

    </div>


    <!-- MARCADOR -->

    <div id="scoreboard">

        <div class="score-team">

            <img id="score-left-img">

            <span id="left-score">0</span>

        </div>

        <span>-</span>

        <div class="score-team">

            <span id="right-score">0</span>

            <img id="score-right-img">

        </div>

    </div>


    <div id="goal-message">
        ¡GOOOOL!
    </div>


    <!-- CONTROLES -->

    <div id="controls">

        <div id="joystick-zone">

            <div id="joystick-base"></div>

            <div id="joystick-stick"></div>

        </div>

        <button
            id="normal-shot"
            class="shot-button"
        >
            TIRO
        </button>

        <button
            id="high-shot"
            class="shot-button"
        >
            TIRO ALTO
        </button>

    </div>


    <!-- FINAL -->

    <div id="end-screen">

        <div class="end-box">

            <h1 id="winner-text">
                ¡GANASTE!
            </h1>

            <button onclick="restartGame()">
                VOLVER A JUGAR
            </button>

        </div>

    </div>

</section>

</div>


<script>

/* =========================
   ARCHIVOS
========================= */

const assets={

    players:{
        mexico:"imagenes/mexicojugador.PNG",
        brasil:"imagenes/brasiljugador.PNG",
        argentina:"imagenes/argentinajugador.PNG",
        alemania:"imagenes/alemaniajugador.PNG"
    },

    shields:{
        mexico:"imagenes/mexicoescudo.PNG",
        brasil:"imagenes/brasilescudo.PNG",
        argentina:"imagenes/argentinaescudo.PNG",
        alemania:"imagenes/alemaniaescudo.PNG"
    }

};


/* =========================
   VARIABLES
========================= */

let selectedCountry="mexico";
let enemyCountry="brasil";

let leftScore=0;
let rightScore=0;

let gameRunning=false;
let goalPause=false;

let animation=null;

const player={
    x:25,
    y:72,
    vx:0,
    jumping:false,
    jumpVelocity:0,
    speed:.055
};

const enemy={
    x:70,
    y:72,
    vx:0,
    speed:.020,
    reaction:1,
    mistakeTimer:0
};

const ball={
    x:50,
    y:70,
    vx:0,
    vy:0,
    rotation:0
};

let joystickX=0;
let joystickY=0;
let joystickTouch=null;


/* =========================
   PANTALLAS
========================= */

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(s=>s.classList.remove("active"));

    document
        .getElementById(id)
        .classList.add("active");

}

function startSelection(){

    showScreen("selection");

}


/* =========================
   SELECCIÓN
========================= */

function chooseCountry(country){

    selectedCountry=country;

    const countries=
        Object.keys(assets.players);

    const enemies=
        countries.filter(c=>c!==country);

    enemyCountry=
        enemies[
            Math.floor(Math.random()*enemies.length)
        ];


    document.getElementById("player-image").src=
        assets.players[selectedCountry];

    document.getElementById("enemy-image").src=
        assets.players[enemyCountry];

    document.getElementById("score-left-img").src=
        assets.shields[selectedCountry];

    document.getElementById("score-right-img").src=
        assets.shields[enemyCountry];


    document
        .getElementById("end-screen")
        .classList.remove("show");


    showScreen("match");

    startGame();

}


/* =========================
   PARTIDO
========================= */

function startGame(){

    if(animation){
        cancelAnimationFrame(animation);
        animation=null;
    }

    leftScore=0;
    rightScore=0;

    updateScore();

    resetPositions();

    gameRunning=true;
    goalPause=false;

    gameLoop();

}


/* =========================
   REINICIAR
========================= */

function restartGame(){

    gameRunning=false;
    goalPause=false;

    if(animation){
        cancelAnimationFrame(animation);
        animation=null;
    }

    document
        .getElementById("end-screen")
        .classList.remove("show");

    showScreen("selection");

}


/* =========================
   POSICIONES
========================= */

function resetPositions(){

    player.x=25;
    player.y=72;
    player.vx=0;
    player.jumping=false;
    player.jumpVelocity=0;

    enemy.x=70;
    enemy.y=72;
    enemy.vx=0;

    ball.x=50;
    ball.y=70;
    ball.vx=0;
    ball.vy=0;
    ball.rotation=0;

    resetJoystick();

    render();

}


/* =========================
   JOYSTICK
========================= */

const joystickZone=
    document.getElementById("joystick-zone");

const joystickStick=
    document.getElementById("joystick-stick");


function updateJoystick(x,y){

    const r=
        joystickZone.getBoundingClientRect();

    const cx=
        r.left+r.width/2;

    const cy=
        r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=45;

    const d=Math.sqrt(dx*dx+dy*dy);

    if(d>max){

        dx=dx/d*max;
        dy=dy/d*max;

    }

    joystickX=dx/max;
    joystickY=dy/max;

    joystickStick.style.transform=
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;

}


function resetJoystick(){

    joystickX=0;
    joystickY=0;

    joystickStick.style.transform=
        "translate(-50%,-50%)";

}


joystickZone.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        const t=e.changedTouches[0];

        joystickTouch=t.identifier;

        updateJoystick(
            t.clientX,
            t.clientY
        );

    },
    {passive:false}
);


joystickZone.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();

        for(const t of e.changedTouches){

            if(t.identifier===joystickTouch){

                updateJoystick(
                    t.clientX,
                    t.clientY
                );

            }

        }

    },
    {passive:false}
);


joystickZone.addEventListener(
    "touchend",
    e=>{

        for(const t of e.changedTouches){

            if(t.identifier===joystickTouch){

                joystickTouch=null;
                resetJoystick();

            }

        }

    },
    {passive:false}
);


/* =========================
   TIROS
========================= */

document
    .getElementById("normal-shot")
    .addEventListener(
        "touchstart",
        e=>{

            e.preventDefault();

            if(gameRunning&&!goalPause)
                shoot(false);

        },
        {passive:false}
    );


document
    .getElementById("high-shot")
    .addEventListener(
        "touchstart",
        e=>{

            e.preventDefault();

            if(gameRunning&&!goalPause)
                shoot(true);

        },
        {passive:false}
    );


function shoot(high){

    const dx=ball.x-player.x;
    const dy=ball.y-player.y;

    const distance=
        Math.sqrt(dx*dx+dy*dy);

    if(distance>12)return;

    if(high){

        ball.vx=.75;
        ball.vy=-1.15;

    }else{

        ball.vx=.55;
        ball.vy=-.08;

    }

    ball.rotation+=high?20:12;

}


/* =========================
   JUGADOR
========================= */

function updatePlayer(){

    if(goalPause)return;

    player.vx=
        joystickX*
        player.speed*
        100;

    player.x+=player.vx;


    if(
        joystickY<-.55&&
        !player.jumping
    ){

        player.jumping=true;
        player.jumpVelocity=-1.25;

    }


    if(player.jumping){

        player.y+=player.jumpVelocity;

        player.jumpVelocity+=.065;

        if(player.y>=72){

            player.y=72;
            player.jumping=false;
            player.jumpVelocity=0;

        }

    }


    player.x=
        Math.max(8,Math.min(91,player.x));

}


/* =========================
   IA
========================= */

function updateEnemy(){

    if(goalPause)return;

    enemy.mistakeTimer--;

    if(enemy.mistakeTimer<=0){

        enemy.mistakeTimer=
            30+Math.random()*100;

        enemy.reaction=
            Math.random()<.22
            ? .3+Math.random()*.5
            : .85+Math.random()*.15;

    }


    let target=
        ball.x+
        (Math.random()-.5)*8;

    const difference=
        target-enemy.x;

    if(Math.abs(difference)>2){

        enemy.vx=
            Math.sign(difference)*
            enemy.speed*
            100*
            enemy.reaction;

        enemy.x+=enemy.vx;

    }


    enemy.x=
        Math.max(8,Math.min(91,enemy.x));


    if(
        Math.abs(ball.x-enemy.x)<8&&
        Math.random()<.025
    ){

        enemyShoot();

    }

}


function enemyShoot(){

    if(Math.random()<.2){

        ball.vx=
            -.15+
            Math.random()*.3;

        ball.vy=-.1;

        return;

    }


    if(Math.random()<.7){

        ball.vx=-.48;
        ball.vy=-.06;

    }else{

        ball.vx=-.65;
        ball.vy=-.8;

    }

}


/* =========================
   BALÓN
========================= */

function updateBall(){

    ball.x+=ball.vx;
    ball.y+=ball.vy;

    ball.vy+=.045;

    ball.vx*=.985;

    ball.rotation+=ball.vx*8;


    if(ball.y>=78){

        ball.y=78;

        if(Math.abs(ball.vy)>.08)
            ball.vy*=-.18;
        else
            ball.vy=0;

    }


    if(ball.y<=5){

        ball.y=5;

        ball.vy=
            Math.abs(ball.vy)*.18;

    }


    if(ball.x<=1){

        ball.x=1;
        ball.vx*= -.35;

    }


    if(ball.x>=99){

        ball.x=99;
        ball.vx*= -.35;

    }

}


/* =========================
   COLISIONES
========================= */

function playerCollision(){

    const distance=
        Math.abs(player.x-enemy.x);

    if(distance<7){

        const push=
            (7-distance)*.5;

        if(player.x<enemy.x){

            player.x-=push;
            enemy.x+=push;

        }else{

            player.x+=push;
            enemy.x-=push;

        }

    }

}


function playerBallCollision(){

    const dx=
        ball.x-player.x;

    const dy=
        ball.y-player.y;

    const d=
        Math.sqrt(dx*dx+dy*dy);

    if(d<7){

        if(player.jumping){

            ball.vy=-.35;

            ball.vx=
                Math.max(ball.vx,.1);

        }else{

            ball.vx+=.06;

        }

    }


    const dx2=
        ball.x-enemy.x;

    const dy2=
        ball.y-enemy.y;

    const d2=
        Math.sqrt(dx2*dx2+dy2*dy2);

    if(d2<7){

        ball.vx-=.04;

    }

}


/* =========================
   GOLES
========================= */

function checkGoal(){

    if(
        ball.x>=96&&
        ball.y>25&&
        ball.y<78
    ){

        scoreGoal("player");
        return;

    }


    if(
        ball.x<=4&&
        ball.y>25&&
        ball.y<78
    ){

        scoreGoal("enemy");

    }

}


function scoreGoal(team){

    if(goalPause)return;

    goalPause=true;


    if(team==="player")
        leftScore++;
    else
        rightScore++;


    updateScore();


    const message=
        document.getElementById("goal-message");

    message.textContent=
        team==="player"
        ?"¡GOOOOL! ⚽"
        :"¡GOL DEL RIVAL!";


    message.classList.add("show");


    setTimeout(()=>{

        message.classList.remove("show");


        if(
            leftScore>=3||
            rightScore>=3
        ){

            finishGame();
            return;

        }


        resetPositions();

        goalPause=false;

    },1300);

}


/* =========================
   MARCADOR
========================= */

function updateScore(){

    document.getElementById("left-score")
        .textContent=leftScore;

    document.getElementById("right-score")
        .textContent=rightScore;

}


/* =========================
   FINAL
========================= */

function finishGame(){

    gameRunning=false;

    if(animation){

        cancelAnimationFrame(animation);
        animation=null;

    }


    document.getElementById("winner-text")
        .textContent=
        leftScore>rightScore
        ?"¡GANASTE! 🏆"
        :"¡GANÓ EL RIVAL!";


    document
        .getElementById("end-screen")
        .classList.add("show");

}


/* =========================
   DIBUJAR
========================= */

function render(){

    const p=
        document.getElementById("player");

    const e=
        document.getElementById("enemy");

    const b=
        document.getElementById("ball");


    p.style.left=player.x+"%";
    p.style.bottom=(100-player.y)+"%";


    e.style.left=enemy.x+"%";
    e.style.bottom=(100-enemy.y)+"%";


    b.style.left=ball.x+"%";
    b.style.top=ball.y+"%";

    b.style.transform=
        `translate(-50%,-50%)
         rotate(${ball.rotation}deg)`;

}


/* =========================
   LOOP
========================= */

function gameLoop(){

    if(!gameRunning)return;

    updatePlayer();
    updateEnemy();
    updateBall();

    playerCollision();
    playerBallCollision();

    checkGoal();

    render();

    animation=
        requestAnimationFrame(gameLoop);

}


/* =========================
   EVITAR SCROLL
========================= */

document.addEventListener(
    "touchmove",
    e=>{

        if(e.target.closest("#controls"))
            e.preventDefault();

    },
    {passive:false}
);

</script>

<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Mini Fútbol</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;

    font-family:Arial,sans-serif;

    background:#102616;
    color:white;
}

button{
    font-family:inherit;
}


/* =====================================================
   PANTALLAS
===================================================== */

.pantalla{
    position:fixed;
    inset:0;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:20px;

    background:
    linear-gradient(
        135deg,
        #1c5b30,
        #08170d
    );

    z-index:100;
}

.oculto{
    display:none !important;
}


/* =====================================================
   MENÚ
===================================================== */

#menu{

    background-image:
    url("imagenes/menufondo.png");

    background-size:cover;
    background-position:center;
}

#titulo{

    font-size:
    clamp(42px,8vw,75px);

    text-align:center;

    text-shadow:
    0 5px 0 #000,
    0 8px 15px rgba(0,0,0,.5);
}

.botonGrande{

    border:none;

    border-radius:15px;

    padding:15px 38px;

    background:white;

    color:#111;

    font-size:21px;
    font-weight:bold;

    box-shadow:
    0 5px 0 rgba(0,0,0,.35);
}

.botonGrande:active{

    transform:translateY(4px);

    box-shadow:
    0 1px 0 rgba(0,0,0,.35);
}


/* =====================================================
   SELECCIÓN DE PAÍSES
===================================================== */

#listaPaises,
#listaRivales{

    display:grid;

    grid-template-columns:
    repeat(4,110px);

    gap:14px;

    max-width:95vw;
}

.pais{

    width:110px;
    min-height:120px;

    border:3px solid transparent;

    border-radius:14px;

    background:rgba(0,0,0,.35);

    color:white;

    padding:8px;
}

.pais img{

    width:65px;
    height:65px;

    object-fit:contain;

    display:block;

    margin:0 auto 6px;
}

.pais.seleccionado{

    border-color:white;

    background:
    rgba(255,255,255,.2);

    transform:scale(1.04);
}

.pais:active{
    transform:scale(.95);
}


/* =====================================================
   JUEGO
===================================================== */

#juego{

    position:fixed;
    inset:0;

    display:flex;
    flex-direction:column;

    background:#111;

    z-index:10;
}


/* =====================================================
   MARCADOR
===================================================== */

#marcador{

    height:50px;
    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    background:
    rgba(0,0,0,.92);

    font-weight:bold;
    font-size:17px;

    z-index:30;
}

.escudoMarcador{

    width:32px;
    height:32px;

    object-fit:contain;
}


/* =====================================================
   ZONA DEL CAMPO
===================================================== */

#zonaCampo{

    position:relative;

    flex:1;
    width:100%;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:#222;
}


/* =====================================================
   CAMPO
===================================================== */

#campo{

    position:relative;

    width:min(100%,1200px);

    aspect-ratio:16 / 9;

    max-height:100%;

    overflow:hidden;

    background:#45a84c;
}


/* =====================================================
   FONDO Y CANCHA
===================================================== */

#fondo{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:0;
}

#cancha{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:1;
}


/* =====================================================
   JUGADORES
===================================================== */

.objeto{

    position:absolute;

    transform:
    translate(-50%,-50%);

    pointer-events:none;
}

#jugador{

    width:7%;

    min-width:45px;
    max-width:85px;

    z-index:8;
}

#rival{

    width:7%;

    min-width:45px;
    max-width:85px;

    z-index:8;
}


/* =====================================================
   BALÓN
===================================================== */

#balon{

    width:3.5%;

    min-width:20px;
    max-width:42px;

    z-index:10;

    transform-origin:center;
}


/* =====================================================
   PORTERÍAS
===================================================== */

.porteria{

    position:absolute;

    width:12%;

    height:28%;

    min-width:75px;
    max-width:150px;

    object-fit:fill;

    z-index:5;

    transform:
    translate(-50%,-50%);
}


/* =====================================================
   CONTROLES
===================================================== */

#controles{

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:50;
}


/* =====================================================
   JOYSTICK
===================================================== */

#joystick{

    position:absolute;

    left:25px;
    bottom:20px;

    width:95px;
    height:95px;

    border-radius:50%;

    background:
    rgba(255,255,255,.18);

    border:
    2px solid
    rgba(255,255,255,.5);

    pointer-events:auto;

    touch-action:none;
}

#palanca{

    position:absolute;

    left:50%;
    top:50%;

    width:45px;
    height:45px;

    border-radius:50%;

    background:
    rgba(255,255,255,.85);

    transform:
    translate(-50%,-50%);

    box-shadow:
    0 4px 8px rgba(0,0,0,.4);
}


/* =====================================================
   BOTONES DE TIRO
===================================================== */

#botonesTiro{

    position:absolute;

    right:25px;
    bottom:20px;

    display:flex;

    gap:12px;

    pointer-events:auto;
}

.botonTiro{

    width:78px;
    height:78px;

    border-radius:50%;

    border:
    2px solid
    rgba(255,255,255,.5);

    background:
    rgba(255,255,255,.18);

    color:white;

    font-weight:bold;
    font-size:12px;

    touch-action:manipulation;
}

.botonTiro:active{

    transform:scale(.9);

    background:
    rgba(255,255,255,.35);
}


/* =====================================================
   RESULTADO
===================================================== */

#resultado{

    background:
    linear-gradient(
        135deg,
        #174d27,
        #07170c
    );
}

#textoResultado{

    font-size:
    clamp(42px,9vw,80px);
}


/* =====================================================
   VERTICAL
===================================================== */

@media (orientation:portrait){

    #marcador{

        height:46px;
        font-size:14px;
    }

    .escudoMarcador{

        width:27px;
        height:27px;
    }

    #zonaCampo{

        align-items:flex-start;

        padding-top:15px;
    }

    #campo{

        width:96vw;
    }

    #joystick{

        width:82px;
        height:82px;

        left:15px;
        bottom:15px;
    }

    #palanca{

        width:40px;
        height:40px;
    }

    #botonesTiro{

        right:15px;
        bottom:15px;
    }

    .botonTiro{

        width:65px;
        height:65px;
    }

    #listaPaises,
    #listaRivales{

        grid-template-columns:
        repeat(2,100px);
    }

    .pais{
        width:100px;
    }
}


/* =====================================================
   HORIZONTAL
===================================================== */

@media (orientation:landscape){

    #campo{

        width:min(
            calc(100vw - 20px),
            1200px
        );
    }
}


/* =====================================================
   PANTALLAS BAJAS
===================================================== */

@media (max-height:500px){

    #marcador{

        height:42px;
        font-size:14px;
    }

    .escudoMarcador{

        width:26px;
        height:26px;
    }

    #joystick{

        width:75px;
        height:75px;

        bottom:10px;
        left:12px;
    }

    #palanca{

        width:36px;
        height:36px;
    }

    #botonesTiro{

        bottom:10px;
        right:12px;
    }

    .botonTiro{

        width:65px;
        height:65px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     MENÚ
===================================================== -->

<section
id="menu"
class="pantalla">

    <h1 id="titulo">
        ⚽ MINI FÚTBOL
    </h1>

    <button
    class="botonGrande"
    onclick="mostrarSeleccion()">

        JUGAR

    </button>

</section>


<!-- =====================================================
     SELECCIÓN DEL JUGADOR
===================================================== -->

<section
id="seleccionJugador"
class="pantalla oculto">

    <h2>
        ELIGE TU PAÍS
    </h2>

    <div id="listaPaises"></div>

    <p id="textoSeleccion">
        Selecciona un país
    </p>

    <button
    id="continuarPais"
    class="botonGrande"
    disabled
    onclick="mostrarRivales()">

        CONTINUAR

    </button>

</section>


<!-- =====================================================
     SELECCIÓN DEL RIVAL
===================================================== -->

<section
id="seleccionRival"
class="pantalla oculto">

    <h2>
        ELIGE TU RIVAL
    </h2>

    <div id="listaRivales"></div>

    <p id="textoRival">
        Selecciona un rival
    </p>

    <button
    id="comenzar"
    class="botonGrande"
    disabled
    onclick="comenzarPartido()">

        COMENZAR

    </button>

</section>


<!-- =====================================================
     PARTIDO
===================================================== -->

<section
id="juego"
class="oculto">


    <!-- MARCADOR -->

    <div id="marcador">

        <img
        id="escudoJugador"
        class="escudoMarcador">

        <span id="nombreJugador">
            México
        </span>

        <strong id="golesJugador">
            0
        </strong>

        <span>
            -
        </span>

        <strong id="golesRival">
            0
        </strong>

        <span id="nombreRival">
            Rival
        </span>

        <img
        id="escudoRival"
        class="escudoMarcador">

    </div>


    <!-- CAMPO -->

    <div id="zonaCampo">

        <div id="campo">


            <img
            id="fondo"
            src="imagenes/fondo.png">


            <img
            id="cancha"
            src="imagenes/cancha.png">


            <img
            id="porteriaIzquierda"
            class="porteria"
            src="imagenes/porteria.png">


            <img
            id="porteriaDerecha"
            class="porteria"
            src="imagenes/porteria.png">


            <img
            id="jugador"
            class="objeto">


            <img
            id="rival"
            class="objeto">


            <img
            id="balon"
            class="objeto"
            src="imagenes/balon.png">


            <!-- CONTROLES -->

            <div id="controles">


                <div id="joystick">

                    <div id="palanca"></div>

                </div>


                <div id="botonesTiro">

                    <button
                    id="tiroNormal"
                    class="botonTiro">

                        TIRO

                    </button>


                    <button
                    id="tiroAlto"
                    class="botonTiro">

                        TIRO
                        <br>
                        ALTO

                    </button>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     RESULTADO
===================================================== -->

<section
id="resultado"
class="pantalla oculto">

    <h1 id="textoResultado">
        ¡GANASTE!
    </h1>

    <h2 id="marcadorFinal">
        3 - 0
    </h2>

    <button
    class="botonGrande"
    onclick="location.reload()">

        JUGAR OTRA VEZ

    </button>

</section>


<script>

/* =====================================================
   PAÍSES
===================================================== */

const paises=[

    {
        id:"mexico",
        nombre:"México",
        escudo:"imagenes/mexicoescudo.png",
        jugador:"imagenes/mexicoplayer.png"
    },

    {
        id:"brasil",
        nombre:"Brasil",
        escudo:"imagenes/brasilescudo.png",
        jugador:"imagenes/brasilplayer.png"
    },

    {
        id:"argentina",
        nombre:"Argentina",
        escudo:"imagenes/argentinaescudo.png",
        jugador:"imagenes/argentinaplayer.png"
    },

    {
        id:"alemania",
        nombre:"Alemania",
        escudo:"imagenes/alemaniaescudo.png",
        jugador:"imagenes/alemaniaplayer.png"
    }

];


/* =====================================================
   VARIABLES
===================================================== */

let miPais=null;
let paisRival=null;

let golesJugador=0;
let golesRival=0;

let juegoActivo=false;
let reiniciando=false;


/* =====================================================
   ELEMENTOS
===================================================== */

const jugador=
document.getElementById("jugador");

const rival=
document.getElementById("rival");

const balon=
document.getElementById("balon");

const porteriaIzquierda=
document.getElementById(
    "porteriaIzquierda"
);

const porteriaDerecha=
document.getElementById(
    "porteriaDerecha"
);


/* =====================================================
   FÍSICA DEL JUGADOR
===================================================== */

const jugadorFisica={

    x:25,
    y:76,

    vx:0,
    vy:0,

    velocidad:.62,

    salto:-1.05,

    suelo:76
};


/* =====================================================
   FÍSICA DEL RIVAL
===================================================== */

const rivalFisica={

    x:75,
    y:76,

    vx:0,
    vy:0,

    velocidad:.34,

    vy:0,

    suelo:76
};


/* =====================================================
   FÍSICA DEL BALÓN
===================================================== */

const balonFisica={

    x:50,
    y:73,

    vx:0,
    vy:0,

    gravedad:.055,

    friccion:.985,

    rotacion:0
};


/* =====================================================
   JOYSTICK
===================================================== */

let joyX=0;
let joyY=0;
let joyActivo=false;

const joystick=
document.getElementById("joystick");

const palanca=
document.getElementById("palanca");


joystick.addEventListener(
    "pointerdown",
    comenzarJoystick
);

joystick.addEventListener(
    "pointermove",
    moverJoystick
);

joystick.addEventListener(
    "pointerup",
    soltarJoystick
);

joystick.addEventListener(
    "pointercancel",
    soltarJoystick
);


function comenzarJoystick(e){

    joyActivo=true;

    joystick.setPointerCapture(
        e.pointerId
    );

    moverJoystick(e);
}


function moverJoystick(e){

    if(!joyActivo)
        return;

    const r=
    joystick.getBoundingClientRect();

    let x=
    e.clientX-
    (r.left+r.width/2);

    let y=
    e.clientY-
    (r.top+r.height/2);

    const limite=
    r.width/2-22;

    const distancia=
    Math.sqrt(x*x+y*y);

    if(distancia>limite){

        x=
        x/distancia*
        limite;

        y=
        y/distancia*
        limite;
    }

    palanca.style.left=
    `calc(50% + ${x}px)`;

    palanca.style.top=
    `calc(50% + ${y}px)`;

    joyX=x/limite;
    joyY=y/limite;
}


function soltarJoystick(){

    joyActivo=false;

    joyX=0;
    joyY=0;

    palanca.style.left="50%";
    palanca.style.top="50%";
}


/* =====================================================
   MENÚ
===================================================== */

function mostrarSeleccion(){

    document
    .getElementById("menu")
    .classList.add("oculto");

    document
    .getElementById("seleccionJugador")
    .classList.remove("oculto");

    crearPaises();
}


/* =====================================================
   PAÍSES
===================================================== */

function crearPaises(){

    const lista=
    document.getElementById(
        "listaPaises"
    );

    lista.innerHTML="";

    paises.forEach(pais=>{

        const boton=
        document.createElement("button");

        boton.className="pais";

        boton.innerHTML=`

            <img src="${pais.escudo}">

            <span>
                ${pais.nombre}
            </span>

        `;

        boton.onclick=()=>{

            miPais=pais;

            document
            .querySelectorAll(
                "#listaPaises .pais"
            )
            .forEach(b=>
                b.classList.remove(
                    "seleccionado"
                )
            );

            boton.classList.add(
                "seleccionado"
            );

            document
            .getElementById(
                "textoSeleccion"
            )
            .textContent=
            "Elegiste: "+
            pais.nombre;

            document
            .getElementById(
                "continuarPais"
            )
            .disabled=false;

        };

        lista.appendChild(boton);

    });
}


/* =====================================================
   RIVALES
===================================================== */

function mostrarRivales(){

    document
    .getElementById(
        "seleccionJugador"
    )
    .classList.add("oculto");

    document
    .getElementById(
        "seleccionRival"
    )
    .classList.remove("oculto");

    const lista=
    document.getElementById(
        "listaRivales"
    );

    lista.innerHTML="";

    paises.forEach(pais=>{

        if(pais===miPais)
            return;

        const boton=
        document.createElement("button");

        boton.className="pais";

        boton.innerHTML=`

            <img src="${pais.escudo}">

            <span>
                ${pais.nombre}
            </span>

        `;

        boton.onclick=()=>{

            paisRival=pais;

            document
            .querySelectorAll(
                "#listaRivales .pais"
            )
            .forEach(b=>
                b.classList.remove(
                    "seleccionado"
                )
            );

            boton.classList.add(
                "seleccionado"
            );

            document
            .getElementById(
                "textoRival"
            )
            .textContent=
            "Rival: "+
            pais.nombre;

            document
            .getElementById(
                "comenzar"
            )
            .disabled=false;

        };

        lista.appendChild(boton);

    });
}


/* =====================================================
   COMENZAR PARTIDO
===================================================== */

function comenzarPartido(){

    golesJugador=0;
    golesRival=0;

    document
    .getElementById(
        "seleccionRival"
    )
    .classList.add("oculto");

    document
    .getElementById(
        "juego"
    )
    .classList.remove("oculto");


    document
    .getElementById(
        "nombreJugador"
    )
    .textContent=
    miPais.nombre;

    document
    .getElementById(
        "nombreRival"
    )
    .textContent=
    paisRival.nombre;


    document
    .getElementById(
        "escudoJugador"
    )
    .src=
    miPais.escudo;

    document
    .getElementById(
        "escudoRival"
    )
    .src=
    paisRival.escudo;


    jugador.src=
    miPais.jugador;

    rival.src=
    paisRival.jugador;


    colocarPorterias();

    reiniciarPosiciones();

    actualizarMarcador();

    juegoActivo=true;

    iniciarBucle();
}


/* =====================================================
   BUCLE
===================================================== */

function iniciarBucle(){

    requestAnimationFrame(
        bucle
    );
}


/* =====================================================
   PORTERÍAS
===================================================== */

function colocarPorterias(){

    porteriaIzquierda.style.left=
    "4%";

    porteriaIzquierda.style.top=
    "67%";

    porteriaDerecha.style.left=
    "96%";

    porteriaDerecha.style.top=
    "67%";
}


/* =====================================================
   REINICIO
===================================================== */

function reiniciarPosiciones(){

    jugadorFisica.x=25;
    jugadorFisica.y=76;

    jugadorFisica.vx=0;
    jugadorFisica.vy=0;


    rivalFisica.x=75;
    rivalFisica.y=76;

    rivalFisica.vx=0;
    rivalFisica.vy=0;


    balonFisica.x=50;
    balonFisica.y=73;

    balonFisica.vx=0;
    balonFisica.vy=0;

    balonFisica.rotacion=0;

    dibujar();
}


/* =====================================================
   MARCADOR
===================================================== */

function actualizarMarcador(){

    document
    .getElementById(
        "golesJugador"
    )
    .textContent=
    golesJugador;

    document
    .getElementById(
        "golesRival"
    )
    .textContent=
    golesRival;
}


/* =====================================================
   MOVIMIENTO JUGADOR
===================================================== */

function actualizarJugador(){

    jugadorFisica.vx=
    joyX*
    jugadorFisica.velocidad;

    jugadorFisica.x+=
    jugadorFisica.vx;


    if(

        joyY<-.55 &&

        jugadorFisica.y>=
        jugadorFisica.suelo

    ){

        jugadorFisica.vy=
        jugadorFisica.salto;
    }


    jugadorFisica.vy+=
    .045;

    jugadorFisica.y+=
    jugadorFisica.vy;


    if(
        jugadorFisica.y>
        jugadorFisica.suelo
    ){

        jugadorFisica.y=
        jugadorFisica.suelo;

        jugadorFisica.vy=0;
    }


    jugadorFisica.x=
    Math.max(
        5,
        Math.min(
            95,
            jugadorFisica.x
        )
    );
}


/* =====================================================
   MOVIMIENTO BALÓN
===================================================== */

function actualizarBalon(){

    balonFisica.vy+=
    balonFisica.gravedad;

    balonFisica.x+=
    balonFisica.vx;

    balonFisica.y+=
    balonFisica.vy;


    if(
        balonFisica.y>=83
    ){

        balonFisica.y=83;

        if(
            Math.abs(
                balonFisica.vy
            )>.12
        ){

            balonFisica.vy*=-.22;

        }else{

            balonFisica.vy=0;
        }
    }


    balonFisica.vx*=
    balonFisica.friccion;


    balonFisica.rotacion+=
    balonFisica.vx*12;


    if(
        balonFisica.y<4
    ){

        balonFisica.y=4;

        balonFisica.vy*=-.18;
    }


    if(
        balonFisica.x<2
    ){

        balonFisica.x=2;

        balonFisica.vx*=-.35;
    }


    if(
        balonFisica.x>98
    ){

        balonFisica.x=98;

        balonFisica.vx*=-.35;
    }
}


/* =====================================================
   CONTACTO JUGADOR-BALÓN
===================================================== */

function contactoJugador(){

    const dx=
    Math.abs(
        balonFisica.x-
        jugadorFisica.x
    );

    const dy=
    Math.abs(
        balonFisica.y-
        jugadorFisica.y
    );


    if(
        dx<8 &&
        dy<10
    ){

        const direccion=
        balonFisica.x>=
        jugadorFisica.x
        ?1
        :-1;


        balonFisica.vx+=
        direccion*.13;


        if(
            jugadorFisica.vy<-.2
        ){

            balonFisica.vy-=
            .15;
        }
    }
}


/* =====================================================
   CONTACTO RIVAL-BALÓN
===================================================== */

function contactoRival(){

    const dx=
    Math.abs(
        balonFisica.x-
        rivalFisica.x
    );

    const dy=
    Math.abs(
        balonFisica.y-
        rivalFisica.y
    );


    if(
        dx<7 &&
        dy<10
    ){

        if(
            Math.random()<.65
        ){

            balonFisica.vx=
            -.25+
            Math.random()*.35;

        }else{

            balonFisica.vx=
            -.05+
            Math.random()*.7;
        }


        if(
            Math.random()<.25
        ){

            balonFisica.vy=
            -.35;
        }
    }
}


/* =====================================================
   COLISIÓN ENTRE JUGADORES
===================================================== */

function colisionJugadores(){

    const distanciaMinima=8;

    const diferencia=
    rivalFisica.x-
    jugadorFisica.x;

    const distancia=
    Math.abs(diferencia);


    if(
        distancia<
        distanciaMinima
    ){

        const direccion=
        diferencia>=0
        ?1
        :-1;


        const empuje=
        (
            distanciaMinima-
            distancia
        )/2;


        jugadorFisica.x-=
        direccion*
        empuje;


        rivalFisica.x+=
        direccion*
        empuje;


        /*
           Pequeño efecto
           de empujón.
        */

        jugadorFisica.vx*=.5;

        rivalFisica.vx*=.5;


        jugadorFisica.x=
        Math.max(
            5,
            Math.min(
                95,
                jugadorFisica.x
            )
        );


        rivalFisica.x=
        Math.max(
            5,
            Math.min(
                95,
                rivalFisica.x
            )
        );
    }
}


/* =====================================================
   IA
===================================================== */

let iaObjetivo=75;

let iaDecision=0;


function actualizarIA(){

    iaDecision--;


    if(
        iaDecision<=0
    ){

        iaDecision=
        20+
        Math.random()*50;


        const error=
        (
            Math.random()-.5
        )*18;


        iaObjetivo=
        balonFisica.x+
        error;


        iaObjetivo=
        Math.max(
            55,
            Math.min(
                94,
                iaObjetivo
            )
        );
    }


    /*
       A veces simplemente
       se queda quieto.
    */

    if(
        Math.random()<.012
    ){

        return;
    }


    const diferencia=
    iaObjetivo-
    rivalFisica.x;


    if(
        Math.abs(diferencia)>1
    ){

        rivalFisica.x+=
        Math.sign(
            diferencia
        )*
        rivalFisica.velocidad;
    }


    rivalFisica.vy+=
    .045;

    rivalFisica.y+=
    rivalFisica.vy;


    if(
        rivalFisica.y>
        rivalFisica.suelo
    ){

        rivalFisica.y=
        rivalFisica.suelo;

        rivalFisica.vy=0;
    }
}


/* =====================================================
   TIRO NORMAL
===================================================== */

function tiroNormal(){

    const distancia=
    Math.abs(
        balonFisica.x-
        jugadorFisica.x
    );


    if(
        distancia>11
    )
        return;


    const punteria=
    (
        Math.random()-.5
    )*.12;


    balonFisica.vx=
    .82+
    punteria;

    balonFisica.vy=
    -.04;
}


/* =====================================================
   TIRO ALTO
===================================================== */

function tiroAlto(){

    const distancia=
    Math.abs(
        balonFisica.x-
        jugadorFisica.x
    );


    if(
        distancia>11
    )
        return;


    const punteria=
    (
        Math.random()-.5
    )*.15;


    balonFisica.vx=
    .72+
    punteria;

    balonFisica.vy=
    -1.40;
}


/* =====================================================
   BOTONES
===================================================== */

document
.getElementById(
    "tiroNormal"
)
.addEventListener(
    "pointerdown",
    tiroNormal
);


document
.getElementById(
    "tiroAlto"
)
.addEventListener(
    "pointerdown",
    tiroAlto
);


/* =====================================================
   DIBUJAR
===================================================== */

function dibujar(){

    jugador.style.left=
    jugadorFisica.x+"%";

    jugador.style.top=
    jugadorFisica.y+"%";


    rival.style.left=
    rivalFisica.x+"%";

    rival.style.top=
    rivalFisica.y+"%";


    balon.style.left=
    balonFisica.x+"%";

    balon.style.top=
    balonFisica.y+"%";


    balon.style.transform=
    `
    translate(-50%,-50%)
    rotate(${balonFisica.rotacion}deg)
    `;
}


/* =====================================================
   GOLES
===================================================== */

function comprobarGoles(){

    if(

        balonFisica.x>97 &&

        balonFisica.y>52 &&

        balonFisica.y<86

    ){

        marcarGolJugador();

        return;
    }


    if(

        balonFisica.x<3 &&

        balonFisica.y>52 &&

        balonFisica.y<86

    ){

        marcarGolRival();

        return;
    }
}


/* =====================================================
   GOL JUGADOR
===================================================== */

function marcarGolJugador(){

    if(reiniciando)
        return;

    reiniciando=true;

    juegoActivo=false;

    golesJugador++;

    actualizarMarcador();


    if(
        golesJugador>=3
    ){

        terminar(true);

        return;
    }


    setTimeout(()=>{

        reiniciarPosiciones();

        reiniciando=false;

        juegoActivo=true;

        iniciarBucle();

    },900);
}


/* =====================================================
   GOL RIVAL
===================================================== */

function marcarGolRival(){

    if(reiniciando)
        return;

    reiniciando=true;

    juegoActivo=false;

    golesRival++;

    actualizarMarcador();


    if(
        golesRival>=3
    ){

        terminar(false);

        return;
    }


    setTimeout(()=>{

        reiniciarPosiciones();

        reiniciando=false;

        juegoActivo=true;

        iniciarBucle();

    },900);
}


/* =====================================================
   FINAL
===================================================== */

function terminar(gane){

    juegoActivo=false;


    document
    .getElementById(
        "juego"
    )
    .classList.add("oculto");


    document
    .getElementById(
        "resultado"
    )
    .classList.remove("oculto");


    document
    .getElementById(
        "textoResultado"
    )
    .textContent=
    gane
    ?"¡GANASTE!"
    :"¡PERDISTE!";


    document
    .getElementById(
        "marcadorFinal"
    )
    .textContent=
    golesJugador+
    " - "+
    golesRival;
}


/* =====================================================
   BUCLE PRINCIPAL
===================================================== */

function bucle(){

    if(!juegoActivo)
        return;


    actualizarJugador();

    actualizarIA();

    colisionJugadores();

    actualizarBalon();

    contactoJugador();

    contactoRival();

    comprobarGoles();

    dibujar();


    requestAnimationFrame(
        bucle
    );
}

</script>
